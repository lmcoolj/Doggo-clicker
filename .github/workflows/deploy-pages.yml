name: Deploy Doggo Clicker to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required for the GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages (source = GitHub Actions) automatically on the
          # first run, so no manual toggle in repo Settings is needed.
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the game
        env:
          # GitHub Pages serves a project repo under /<repo-name>/. The exact
          # base path (with correct casing) comes from configure-pages so we
          # never have to hardcode the repo name. Vite bakes it into all asset
          # URLs; the trailing slash is required by Vite.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # vite.config.ts requires PORT to be set even for a build; the value
          # is irrelevant when building (no server is started).
          PORT: "4173"
        run: pnpm --filter @workspace/doggo-clicker run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/doggo-clicker/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
